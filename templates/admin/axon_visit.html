{% load tz %}<a class="calendar-visit{% if entry.visit.status == 'cancelled' %} is-cancelled{% endif %}" href="{{ entry.url }}"><span class="visit-time">{{ entry.visit.starts_at|localtime|date:"H:i" }}–{{ entry.visit.ends_at|localtime|date:"H:i" }}</span><strong>{{ entry.visit.client.name }}</strong><span>{{ entry.visit.service.name }}</span>{% if show_specialist %}<span class="visit-specialist">{{ entry.visit.specialist.name }}</span>{% endif %}{% if entry.visit.status == 'cancelled' %}<span class="visit-status">Отменена</span>{% endif %}</a>
